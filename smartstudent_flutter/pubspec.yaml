name: smartstudent
description: SmartStudent - AI-Powered Educational Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  hooks_riverpod: ^2.4.0
  flutter_hooks: ^0.18.0
  
  # HTTP & Networking
  dio: ^5.3.0
  http: ^1.1.0
  
  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Security
  flutter_secure_storage: ^9.0.0
  
  # Navigation
  go_router: ^10.0.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0
  
  # UI
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  
  # Utilities
  uuid: ^4.0.0
  json_serializable: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
